[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./contracts/generated" }]

[fmt]
line_length = 120
tab_width = 4
