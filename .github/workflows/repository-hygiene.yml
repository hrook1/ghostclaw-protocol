name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check indexed source and publication guard
        run: |
          npm run test:repository
          npm run check:repository
      - name: Install the checksum-pinned secret scanner
        env:
          SCANNER_VERSION: 8.30.1
          SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          scanner_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${SCANNER_VERSION}/gitleaks_${SCANNER_VERSION}_linux_x64.tar.gz" \
            --output "$scanner_dir/scanner.tar.gz"
          printf '%s  %s\n' "$SCANNER_SHA256" "$scanner_dir/scanner.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/scanner.tar.gz" -C "$scanner_dir" gitleaks
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan all proposed files and nested archives
        run: npm run check:secrets
      - name: Scan publication history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != '0000000000000000000000000000000000000000' ]; then
            scan_range="$BASE_SHA..HEAD"
          else
            scan_range=--all
          fi
          gitleaks git . --config=.gitleaks.toml --log-opts="$scan_range" \
            --redact=100 --no-banner --no-color --ignore-gitleaks-allow \
            --max-archive-depth=4 --max-decode-depth=2
      - name: Check generated website documentation
        run: |
          npm run site:docs
          git diff --exit-code -- site/docs site/docs.html
